<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест рівня англійської — OK Language School</title>
  <meta name="description" content="Короткий тест рівня англійської: 18 питань, до 10 хвилин, результат CEFR і рекомендація курсу.">

  <meta property="og:title" content="Тест рівня англійської — OK Language School">
  <meta property="og:description" content="Пройдіть тест за 10 хвилин та отримайте свій рівень CEFR.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="uk_UA">
  <meta property="og:image" content="assets/images/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>
  <header class="header" id="site-header"></header>

  <main id="main-content">
    <section class="test-hero" style="background-image: linear-gradient(120deg, rgba(11, 30, 63, 0.82), rgba(14, 47, 94, 0.45)), url('assets/images/ok-school-bg.png');">
      <div class="container">
        <div class="test-hero__content">
          <h1 class="test-hero__title">Тест рівня англійської</h1>
          <p class="test-hero__subtitle">18 питань • до 10 хвилин • результат CEFR одразу</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="test-shell" id="level-test-app">
          <div class="test-screen" id="test-start">
            <h2 class="test-shell__title">Оберіть профіль перед стартом</h2>
            <p class="test-shell__subtitle">Так результат буде точнішим, а рекомендація курсу — кориснішою.</p>
            <div class="profile-grid" id="profile-list"></div>
          </div>

          <div class="test-screen" id="test-quiz" hidden>
            <div class="quiz-meta">
              <p class="quiz-meta__profile" id="quiz-profile"></p>
              <p class="quiz-meta__timer">Час: <strong id="quiz-timer">10:00</strong></p>
            </div>
            <p class="quiz-meta__progress" id="quiz-progress"></p>
            <h2 class="quiz-question" id="quiz-question"></h2>
            <div class="quiz-options" id="quiz-options"></div>
            <div class="quiz-actions">
              <button type="button" class="btn btn--primary" id="quiz-next" disabled>Далі</button>
            </div>
          </div>

          <div class="test-screen" id="test-result" hidden>
            <h2 class="test-shell__title">Ваш результат готовий</h2>
            <div class="result-card">
              <p class="result-card__label">Рівень</p>
              <p class="result-card__level" id="result-level"></p>
              <p class="result-card__score" id="result-score"></p>
              <p class="result-card__feedback" id="result-feedback"></p>
              <div class="result-card__courses" id="result-courses"></div>
              <div class="result-card__actions">
                <a href="#" class="btn btn--primary btn--large" id="result-viber" data-viber-fallback="https://www.viber.com/">Отримати план у Viber</a>
                <button type="button" class="btn btn--secondary" id="result-copy">Скопіювати результат</button>
                <button type="button" class="btn btn--secondary" id="result-restart">Пройти ще раз</button>
              </div>
              <p class="result-card__note" id="result-note"></p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script type="module" src="assets/js/main.js"></script>
  <script type="module" src="assets/js/level-test.js"></script>
</body>
</html>
