<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розклад занять — OK Language School</title>
  <meta name="description"
    content="Розклад занять з англійської мови в OK Language School. Знайдіть зручний час для вашого рівня та вікової групи.">

  <meta property="og:title" content="Розклад занять — OK Language School">
  <meta property="og:description" content="Інтерактивний розклад занять з англійської мови у Новому Розділі.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="uk_UA">
  <meta property="og:image" content="assets/images/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>
  <header class="header" id="site-header"></header>

  <main id="main-content">
    <section class="page-header">
      <div class="container">
        <h1 class="page-header__title">Розклад занять</h1>
        <p class="page-header__subtitle">Знайдіть зручний час для вашого курсу</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- Filters -->
        <div class="schedule-filters">
          <div class="form__group">
            <label class="form__label" for="filter-day">День тижня</label>
            <select class="form__select" id="filter-day">
              <option value="all">Всі дні</option>
              <option value="Понеділок">Понеділок</option>
              <option value="Вівторок">Вівторок</option>
              <option value="Середа">Середа</option>
              <option value="Четвер">Четвер</option>
              <option value="П'ятниця">П'ятниця</option>
              <option value="Субота">Субота</option>
            </select>
          </div>
          <div class="form__group">
            <label class="form__label" for="filter-age">Вікова група</label>
            <select class="form__select" id="filter-age">
              <option value="all">Всі вікові групи</option>
              <option value="kids">Діти (6-9)</option>
              <option value="teens">Підлітки (10-17)</option>
              <option value="adults">Дорослі (16+)</option>
            </select>
          </div>
          <div class="form__group">
            <label class="form__label" for="filter-level">Рівень</label>
            <select class="form__select" id="filter-level">
              <option value="all">Всі рівні</option>
              <option value="Starter">Starter</option>
              <option value="A1">A1</option>
              <option value="A2">A2</option>
              <option value="B1">B1</option>
              <option value="B2">B2</option>
              <option value="C1">C1</option>
            </select>
          </div>
          <div class="form__group">
            <label class="form__label" for="filter-type">Тип</label>
            <select class="form__select" id="filter-type">
              <option value="all">Всі типи</option>
              <option value="group">Група</option>
              <option value="club">Клуб</option>
            </select>
          </div>
        </div>

        <!-- Table view (desktop) -->
        <div id="schedule-table-container">
          <!-- Populated by schedule.js -->
        </div>

        <!-- Cards view (mobile) -->
        <div id="schedule-cards-container" class="schedule-cards">
          <!-- Populated by schedule.js -->
        </div>
      </div>
    </section>

    <section class="section section--gray">
      <div class="container">
        <div class="cta-block animate-on-scroll">
          <h2 class="cta-block__title">Не знайшли зручний час?</h2>
          <p class="cta-block__text">Зателефонуйте нам. Ми можемо запропонувати інший графік або підказати найближчі нові групи.</p>
          <a href="contact.html#quick-contact" class="btn btn--outline btn--large">Перейти до телефонів</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/schedule.js"></script>
</body>

</html>
